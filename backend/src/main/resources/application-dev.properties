debug=false
trace=false
# LOGGING
logging.config=classpath:log4j2.xml
# IDENTITY (ContextIdApplicationContextInitializer)
spring.application.name=Neight Tec Antivirus Server
# EMBEDDED SERVER CONFIGURATION (ServerProperties)
server.error.whitelabel.enabled=false
server.port=8080
server.servlet.context-path=/ntav-api
server.ssl.enabled=false
server.tomcat.max-swallow-size=-1
server.tomcat.secure=true
# MULTIPART (MultipartProperties)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
spring.servlet.multipart.resolve-lazily=true
# ----------------------------------------
# DATA PROPERTIES
# ----------------------------------------
# LIQUIBASE (LiquibaseProperties)
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/database/changelog/db.changelog-project.xml
spring.liquibase.drop-first=false
spring.liquibase.default-schema=neight
spring.liquibase.contexts=dev
# DATASOURCE (DataSourceAutoConfiguration & DataSourceProperties)
#com.neightec.av-server.datasource.serverName=localhost
#com.neightec.av-server.datasource.portNumber=5480
#com.neightec.av-server.datasource.databaseName=neightec
com.neightec.av-server.datasource.url=jdbc:postgresql://localhost:5481/neight
com.neightec.av-server.datasource.driverClassName=org.postgresql.Driver
com.neightec.av-server.datasource.schema=neight
com.neightec.av-server.datasource.primary.dataSourceClassName=org.postgresql.ds.PGSimpleDataSource
com.neightec.av-server.datasource.username=neight
