<form [formGroup]="formGroupAccountAdd" class="accounts-add-form" (ngSubmit)="onSubmit()">
    <header class="accounts-add-form__header">
        <h2>Konto anlegen</h2>
        <button type="button" class="icon-button" (click)="closeDialog()" aria-label="Schließen">
            <mat-icon fontIcon="close"></mat-icon>
        </button>
    </header>

    <label class="accounts-add-form__field">
        <span>Name</span>
        <input formControlName="accountName" placeholder="z. B. Girokonto" maxLength="50">
    </label>

    <label class="accounts-add-form__field">
        <span>Kontostand (€)</span>
        <input formControlName="accountBalance" type="number" step="0.01" placeholder="0,00">
    </label>

    <footer class="accounts-add-form__actions">
        <button type="button" class="button button--secondary" (click)="closeDialog()">Abbrechen</button>
        <button type="submit" class="button button--primary" [disabled]="formGroupAccountAdd.invalid">Anlegen</button>
    </footer>
</form>
