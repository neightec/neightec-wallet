<table mat-table matSort [dataSource]="dataSource" class="transaction-table">
  <ng-container matColumnDef="name">
    <th mat-header-cell mat-sort-header *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let row">{{ row.name }}</td>
  </ng-container>

  <ng-container matColumnDef="category_type">
    <th mat-header-cell mat-sort-header *matHeaderCellDef>Kategorie</th>
    <td mat-cell *matCellDef="let row">{{ row.category_type }}</td>
  </ng-container>

  <ng-container matColumnDef="price">
    <th mat-header-cell mat-sort-header *matHeaderCellDef>Preis</th>
    <td mat-cell *matCellDef="let row">{{ row.price | number: '1.2-2' }}</td>
  </ng-container>

  <ng-container matColumnDef="currency_type">
    <th mat-header-cell mat-sort-header *matHeaderCellDef>Währung</th>
    <td mat-cell *matCellDef="let row">{{ row.currency_type }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>


<mat-paginator
  [pageSizeOptions]="pageSizeOptions"
  [pageSize]="pageSizeOptions[0]"
  showFirstLastButtons>
</mat-paginator>
